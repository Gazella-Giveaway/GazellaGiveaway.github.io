<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gazella Giveaway</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 20% 20%,#123c37,transparent 35%),
    radial-gradient(circle at 80% 80%,#242044,transparent 35%),
    #050508;
}

.card{
  width:100%;
  max-width:520px;
  padding:35px 24px;
  border-radius:30px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(20px);
  box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:50px;
  background:rgba(0,255,213,.1);
  border:1px solid rgba(0,255,213,.3);
  color:#00ffd5;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
}

h1{
  margin-top:22px;
  font-size:30px;
}

.subtitle{
  margin-top:10px;
  color:#aaa;
  line-height:1.6;
}

.progress{
  height:7px;
  margin:25px 0;
  background:#222;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#00ffd5;
  transition:.3s;
}

.question{
  font-size:21px;
  font-weight:bold;
  line-height:1.4;
  margin-bottom:20px;
}

.option{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;
  background:rgba(255,255,255,.06);
  color:white;
  text-align:left;
  font-size:16px;
  cursor:pointer;
}

.option:hover{
  background:rgba(0,255,213,.12);
  border-color:#00ffd5;
}

.small{
  margin-top:20px;
  color:#777;
  font-size:13px;
  text-align:center;
}

#result{
  display:none;
  text-align:center;
}

.prize{
  margin:20px 0;
  font-size:55px;
  font-weight:900;
  color:#00ffd5;
}

.button{
  display:block;
  margin-top:25px;
  padding:16px;
  border-radius:15px;
  background:#00ffd5;
  color:#00110e;
  text-decoration:none;
  font-weight:900;
  text-align:center;
}

.retry{
  background:rgba(255,255,255,.08);
  color:white;
}
</style>
</head>

<body>

<div class="card">

  <div id="quiz">

    <div class="badge">GAZELLA • CHALLENGE</div>

    <h1>Think fast. Score perfect.</h1>

    <p class="subtitle">
      Answer all 15 general-knowledge questions.
      A perfect 15/15 takes you to the redemption stage.
    </p>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="questionBox"></div>

    <div class="small" id="counter"></div>

  </div>

  <div id="result">

    <div class="badge">QUIZ COMPLETED</div>

    <h1 id="resultTitle"></h1>

    <div class="prize">₹25,000</div>

    <p id="resultText" class="subtitle"></p>

    <a
      id="redeemButton"
      class="button"
      href="redeem.html"
      style="display:none;"
    >
      CONTINUE TO REDEMPTION
    </a>

    <button
      class="button retry"
      onclick="location.reload()"
    >
      TRY AGAIN
    </button>

  </div>

</div>

<script>
const questions = [
  {
    q:"What is the capital of India?",
    a:["Mumbai","New Delhi","Kolkata","Chennai"],
    correct:"New Delhi"
  },
  {
    q:"Which planet is known as the Red Planet?",
    a:["Venus","Mars","Jupiter","Mercury"],
    correct:"Mars"
  },
  {
    q:"How many continents are there?",
    a:["5","6","7","8"],
    correct:"7"
  },
  {
    q:"Which is the largest ocean on Earth?",
    a:["Atlantic Ocean","Indian Ocean","Arctic Ocean","Pacific Ocean"],
    correct:"Pacific Ocean"
  },
  {
    q:"Who wrote the Indian national anthem?",
    a:["Mahatma Gandhi","Rabindranath Tagore","Jawaharlal Nehru","Sarojini Naidu"],
    correct:"Rabindranath Tagore"
  },
  {
    q:"What is H₂O commonly known as?",
    a:["Oxygen","Hydrogen","Water","Carbon dioxide"],
    correct:"Water"
  },
  {
    q:"Which is the fastest land animal?",
    a:["Lion","Cheetah","Tiger","Leopard"],
    correct:"Cheetah"
  },
  {
    q:"How many days are in a leap year?",
    a:["364","365","366","367"],
    correct:"366"
  },
  {
    q:"Which is the largest planet in our solar system?",
    a:["Earth","Saturn","Jupiter","Neptune"],
    correct:"Jupiter"
  },
  {
    q:"What is the currency of Japan?",
    a:["Won","Yuan","Yen","Ringgit"],
    correct:"Yen"
  },
  {
    q:"Which organ pumps blood around the human body?",
    a:["Lungs","Brain","Heart","Kidney"],
    correct:"Heart"
  },
  {
    q:"The chemical symbol Au represents which element?",
    a:["Silver","Gold","Copper","Aluminium"],
    correct:"Gold"
  },
  {
    q:"How many players are on the field for one cricket team?",
    a:["9","10","11","12"],
    correct:"11"
  },
  {
    q:"Which planet is closest to the Sun?",
    a:["Venus","Earth","Mercury","Mars"],
    correct:"Mercury"
  },
  {
    q:"Which instrument is used to measure temperature?",
    a:["Barometer","Thermometer","Hygrometer","Altimeter"],
    correct:"Thermometer"
  }
];

let current = 0;
let score = 0;

const questionBox = document.getElementById("questionBox");
const counter = document.getElementById("counter");
const progressBar = document.getElementById("progressBar");

function showQuestion(){

  const item = questions[current];

  questionBox.innerHTML = `
    <div class="question">${item.q}</div>

    ${item.a.map(answer => `
      <button class="option" onclick="answerQuestion('${answer.replace(/'/g,"\\'")}')">
        ${answer}
      </button>
    `).join("")}
  `;

  counter.textContent =
    `Question ${current + 1} of ${questions.length}`;

  progressBar.style.width =
    `${((current) / questions.length) * 100}%`;
}

function answerQuestion(answer){

  if(answer === questions[current].correct){
    score++;
  }

  current++;

  if(current < questions.length){
    showQuestion();
  }else{
    finishQuiz();
  }
}

function finishQuiz(){

  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";

  progressBar.style.width="100%";

  const title = document.getElementById("resultTitle");
  const text = document.getElementById("resultText");
  const button = document.getElementById("redeemButton");

  if(score === 15){

    title.textContent="Perfect Score 🎉";

    text.innerHTML =
      "You answered all 15 questions correctly.<br>" +
      "You have qualified for the prize redemption process.";

    button.style.display="block";

  }else{

    title.textContent=`Score: ${score}/15`;

    text.innerHTML =
      "A perfect 15/15 is required to continue.<br>" +
      "Please review the questions and try again.";

    button.style.display="none";
  }
}

showQuestion();
</script>

</body>
</html>
