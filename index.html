<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GAZELLA — Don't Trust The Floor</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  position:fixed;
  inset:0;
  background:#07090d;
  touch-action:none;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
}

button{
  border:0;
  outline:0;
  touch-action:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
"use strict";

/* =========================================================
   GAZELLA — DON'T TRUST THE FLOOR
   One-file mobile platform game
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", {alpha:false});

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

/* Prevent browser gestures */
for(const ev of [
  "touchstart","touchmove","touchend",
  "gesturestart","gesturechange","gestureend",
  "dblclick","contextmenu"
]){
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
}

/* ---------------- AUDIO ---------------- */

let audioCtx=null;

function audio(){
  if(!audioCtx){
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    }catch(e){}
  }
}

function beep(freq,duration,type="square",volume=.035){
  if(!audioCtx)return;
  try{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    o.type=type;
    o.frequency.value=freq;
    g.gain.value=volume;

    o.connect(g);
    g.connect(audioCtx.destination);

    g.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime+duration
    );

    o.start();
    o.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

/* ---------------- GAME STATE ---------------- */

let state="menu";
let level=0;
let deaths=0;
let coins=0;

let cameraX=0;
let levelWidth=3200;

let last=performance.now();
let shake=0;

const keys={
  left:false,
  right:false,
  jump:false
};

let jumpPressed=false;

/* ---------------- PLAYER ---------------- */

const player={
  x:100,
  y:300,
  w:27,
  h:38,
  vx:0,
  vy:0,
  speed:4.6,
  jump:11.5,
  grounded:false,
  coyote:0,
  face:1,
  alive:true
};

/* ---------------- WORLD ---------------- */

let platforms=[];
let spikes=[];
let moving=[];
let coinsList=[];
let traps=[];
let enemies=[];
let particles=[];
let messages=[];

let exit={
  x:3000,
  y:300,
  w:50,
  h:75,
  fake:false,
  open:true
};

let gimmick={
  floorDrop:false,
  ceiling:false,
  reverse:false,
  fakeExit:false,
  darkness:false
};

/* =========================================================
   LEVEL GENERATION
========================================================= */

function addPlatform(x,y,w,h=28,type="normal"){
  platforms.push({
    x,y,w,h,type,
    originalY:y,
    active:true,
    timer:0,
    touched:false
  });
}

function addSpike(x,y,w=34,h=30){
  spikes.push({x,y,w,h,active:true});
}

function addMoving(x,y,w,h,dx,dy,speed){
  moving.push({
    x,y,w,h,
    sx:x,sy:y,
    dx,dy,
    t:Math.random()*10,
    speed
  });
}

function addCoin(x,y){
  coinsList.push({
    x,y,
    r:9,
    taken:false,
    spin:Math.random()*6
  });
}

function addTrap(x,y,w,h,kind){
  traps.push({
    x,y,w,h,
    kind,
    active:false,
    triggered:false,
    timer:0
  });
}

function addEnemy(x,y,min,max){
  enemies.push({
    x,y,
    w:28,
    h:34,
    vx:1.2,
    min,
    max,
    alive:true
  });
}

function resetWorld(){
  platforms=[];
  spikes=[];
  moving=[];
  coinsList=[];
  traps=[];
  enemies=[];
  particles=[];
  messages=[];

  player.alive=true;
  player.vx=0;
  player.vy=0;
  player.grounded=false;

  cameraX=0;

  gimmick={
    floorDrop:false,
    ceiling:false,
    reverse:false,
    fakeExit:false,
    darkness:false
  };
}

/* Handcrafted-style procedural stages */

function buildLevel(n){

  resetWorld();

  const ground=H-105;

  /* starting platform */
  addPlatform(0,ground,430);

  /* base layout */
  let x=470;

  for(let i=0;i<13;i++){

    const gap=25+(i%3)*12;
    const width=145+(i%4)*22;
    const y=ground-(i%5)*22;

    addPlatform(x,y,width);

    if(i%4===1){
      addSpike(x+width*.45,y-30,34);
    }

    if(i%4===2){
      addCoin(x+width*.55,y-45);
    }

    if(i%5===0 && i>0){
      addMoving(
        x-60,
        y-75,
        100,
        22,
        0,
        90,
        .018
      );
    }

    x+=width+gap;
  }

  /* Level-specific tricks */

  if(n===0){
    addCoin(270,ground-50);
    addCoin(760,ground-85);
    exit={x:2850,y:ground-75,w:50,h:75,fake:false,open:true};
  }

  if(n===1){
    gimmick.floorDrop=true;

    addTrap(600,ground-10,110,30,"drop");
    addTrap(1180,ground-32,120,30,"drop");
    addTrap(1880,ground-55,130,30,"drop");

    exit={x:3000,y:ground-75,w:50,h:75,fake:false,open:true};
  }

  if(n===2){
    gimmick.ceiling=true;

    for(let i=0;i<5;i++){
      addSpike(
        700+i*370,
        95,
        40,
        55
      );
    }

    exit={x:3020,y:ground-75,w:50,h:75,fake:false,open:true};
  }

  if(n===3){
    gimmick.reverse=true;

    addTrap(900,ground-5,120,30,"reverse");
    addTrap(1750,ground-5,120,30,"reverse");

    exit={x:3030,y:ground-75,w:50,h:75,fake:false,open:true};
  }

  if(n===4){
    gimmick.fakeExit=true;

    exit={
      x:2150,
      y:ground-75,
      w:50,
      h:75,
      fake:true,
      open:true
    };

    addTrap(2100,ground-20,140,30,"fake");

    addPlatform(2400,ground-60,230);
    addPlatform(2700,ground-10,300);

    addSpike(2500,ground-90);
    addSpike(2750,ground-40);

    exit.x=2980;
    exit.y=ground-85;
    exit.fake=false;
  }

  if(n===5){
    gimmick.darkness=true;

    for(let i=0;i<8;i++){
      addCoin(650+i*280,ground-75);
    }

    addSpike(1000,ground-30,42);
    addSpike(1580,ground-55,42);
    addSpike(2300,ground-30,42);

    exit={x:3040,y:ground-75,w:50,h:75,fake:false,open:true};
  }

  if(n===6){
    for(let i=0;i<7;i++){
      addMoving(
        550+i*360,
        ground-80-(i%2)*80,
        100,
        22,
        80,
        0,
        .012+i*.001
      );
    }

    exit={x:3040,y:ground-120,w:50,h:75,fake:false,open:true};
  }

  if(n===7){
    addEnemy(850,ground-34,700,1100);
    addEnemy(1450,ground-34,1300,1750);
    addEnemy(2200,ground-34,2050,2500);

    addSpike(1100,ground-30);
    addSpike(1800,ground-30);

    exit={x:3040,y:ground-75,w:50,h:75,fake:false,open:true};
  }

  if(n>=8){

    for(let i=0;i<10;i++){

      const px=550+i*270;
      const py=ground-(i%4)*45;

      if(i%3===0){
        addPlatform(px,py,125,28,"crumble");
      }

      if(i%3!==0){
        addPlatform(px,py,160);
      }

      if(i%2===0){
        addSpike(px+80,py-30);
      }

      if(i%2===1){
        addCoin(px+80,py-48);
      }
    }

    if(n%3===0){
      gimmick.floorDrop=true;
      addTrap(1100,ground-10,120,30,"drop");
      addTrap(2180,ground-30,130,30,"drop");
    }

    if(n%3===1){
      gimmick.reverse=true;
      addTrap(1500,ground-10,130,30,"reverse");
    }

    if(n%3===2){
      gimmick.ceiling=true;
      addSpike(1350,90,44,55);
      addSpike(2150,90,44,55);
    }

    addEnemy(
      1700,
      ground-34,
      1500,
      2000
    );

    exit={
      x:3050,
      y:ground-100,
      w:50,
      h:75,
      fake:false,
      open:true
    };
  }

  levelWidth=3200;
  player.x=90;
  player.y=ground-70;

  /* more coins */
  for(let i=0;i<4;i++){
    addCoin(
      400+i*680,
      ground-100-(i%2)*50
    );
  }
}

/* ---------------- LEVEL START ---------------- */

function startGame(){
  audio();
  state="play";
  level=0;
  deaths=0;
  coins=0;
  buildLevel(level);
  beep(440,.08);
}

function nextLevel(){
  level++;

  if(level>=20){
    state="win";
    beep(880,.18,"sine",.06);
    return;
  }

  buildLevel(level);
  beep(620,.08);
}

/* ---------------- DEATH ---------------- */

function die(){

  if(!player.alive)return;

  player.alive=false;
  deaths++;

  shake=12;

  for(let i=0;i<20;i++){
    particles.push({
      x:player.x+player.w/2,
      y:player.y+player.h/2,
      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,
      life:30
    });
  }

  beep(90,.12,"sawtooth",.05);

  setTimeout(()=>{
    if(state==="play"){
      buildLevel(level);
    }
  },260);
}

/* ---------------- INPUT ---------------- */

addEventListener("keydown",e=>{

  if(["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD","KeyW"].includes(e.code)){
    e.preventDefault();
  }

  if(e.code==="ArrowLeft"||e.code==="KeyA")
    keys.left=true;

  if(e.code==="ArrowRight"||e.code==="KeyD")
    keys.right=true;

  if(e.code==="ArrowUp"||e.code==="Space"||e.code==="KeyW"){
    if(!keys.jump)jumpPressed=true;
    keys.jump=true;
  }

  if(e.code==="Enter" && state!=="play"){
    startGame();
  }
});

addEventListener("keyup",e=>{

  if(e.code==="ArrowLeft"||e.code==="KeyA")
    keys.left=false;

  if(e.code==="ArrowRight"||e.code==="KeyD")
    keys.right=false;

  if(e.code==="ArrowUp"||e.code==="Space"||e.code==="KeyW")
    keys.jump=false;
});

/* Touch controls */

function button(x,y,w,h,action){

  const inside=(px,py)=>
    px>=x && px<=x+w && py>=y && py<=y+h;

  canvas.addEventListener("pointerdown",e=>{

    if(!inside(e.clientX,e.clientY))return;

    audio();

    try{
      canvas.setPointerCapture(e.pointerId);
    }catch(_){}

    action(true,e);

  });

  canvas.addEventListener("pointerup",e=>{
    action(false,e);
  });

  canvas.addEventListener("pointercancel",e=>{
    action(false,e);
  });
}

function controls(){

  const size=Math.min(86,W*.19);
  const gap=14;
  const y=H-size-22;

  button(
    18,y,
    size,size,
    (on)=>{
      keys.left=on;
    }
  );

  button(
    18+size+gap,y,
    size,size,
    (on)=>{
      keys.right=on;
    }
  );

  button(
    W-size-20,y-20,
    size,size,
    (on)=>{
      if(on && !keys.jump)jumpPressed=true;
      keys.jump=on;
    }
  );
}

controls();

/* ---------------- COLLISION ---------------- */

function rects(a,b){
  return (
    a.x < b.x+b.w &&
    a.x+a.w > b.x &&
    a.y < b.y+b.h &&
    a.y+a.h > b.y
  );
}

/* ---------------- UPDATE ---------------- */

function update(dt){

  if(state!=="play")return;

  if(!player.alive)return;

  let direction=0;

  if(keys.left)direction--;
  if(keys.right)direction++;

  if(gimmick.reverse){
    /* only affects player inside active reverse trap */
    for(const t of traps){
      if(
        t.kind==="reverse" &&
        t.active &&
        rects(player,t)
      ){
        direction*=-1;
      }
    }
  }

  if(direction!==0){
    player.vx += direction*0.75;
    player.face=direction;
  }else{
    player.vx*=.78;
  }

  player.vx=Math.max(-player.speed,Math.min(player.speed,player.vx));

  /* jump */
  if(jumpPressed){

    if(player.grounded || player.coyote>0){
      player.vy=-player.jump;
      player.grounded=false;
      beep(390,.06);
    }

    jumpPressed=false;
  }

  player.vy+=.52;

  if(player.vy>14)player.vy=14;

  /* horizontal */
  player.x+=player.vx;

  if(player.x<0){
    player.x=0;
    player.vx=0;
  }

  if(player.x>levelWidth-player.w){
    player.x=levelWidth-player.w;
  }

  /* moving platforms */
  for(const m of moving){

    m.t+=dt*m.speed*60;

    m.x=m.sx+Math.sin(m.t)*m.dx;
    m.y=m.sy+Math.sin(m.t*.8)*m.dy;
  }

  /* vertical movement */
  const oldBottom=player.y+player.h;

  player.y+=player.vy;
  player.grounded=false;

  /* normal platforms */

  for(const p of platforms){

    if(!p.active)continue;

    const horizontal=
      player.x+player.w>p.x &&
      player.x<p.x+p.w;

    if(
      horizontal &&
      oldBottom<=p.y &&
      player.y+player.h>=p.y &&
      player.vy>=0
    ){

      player.y=p.y-player.h;
      player.vy=0;
      player.grounded=true;
      player.coyote=.12;

      if(p.type==="crumble"){
        p.touched=true;
        p.timer+=dt;

        if(p.timer>.42){
          p.active=false;

          for(let i=0;i<8;i++){
            particles.push({
              x:p.x+Math.random()*p.w,
              y:p.y,
              vx:(Math.random()-.5)*3,
              vy:Math.random()*2,
              life:25
            });
          }
        }
      }
    }
  }

  /* moving platform collision */

  for(const p of moving){

    const horizontal=
      player.x+player.w>p.x &&
      player.x<p.x+p.w;

    if(
      horizontal &&
      oldBottom<=p.y &&
      player.y+player.h>=p.y &&
      player.vy>=0
    ){

      player.y=p.y-player.h;
      player.vy=0;
      player.grounded=true;
    }
  }

  if(player.grounded)
    player.coyote=.12;
  else
    player.coyote-=dt;

  /* falling */
  if(player.y>H+120){
    die();
    return;
  }

  /* traps */

  for(const t of traps){

    if(
      !t.triggered &&
      rects(player,{
        x:t.x,
        y:t.y-45,
        w:t.w,
        h:55
      })
    ){
      t.triggered=true;
      t.active=true;
      t.timer=0;
    }

    if(t.active){

      t.timer+=dt;

      if(t.kind==="drop" && t.timer>.18){

        for(const p of platforms){

          if(
            p.x<t.x+t.w &&
            p.x+p.w>t.x &&
            Math.abs(p.y-t.y)<55
          ){
            p.active=false;
          }
        }
      }

      if(t.kind==="fake" && t.timer>.1){
        /* surprise spike burst */
        for(let i=0;i<5;i++){
          addSpike(
            t.x+i*28,
            t.y-30,
            25,
            30
          );
        }
        t.active=false;
      }

      if(t.kind==="reverse" && t.timer>3){
        t.active=false;
      }
    }
  }

  /* spikes */

  for(const s of spikes){

    if(
      s.active &&
      rects(player,{
        x:s.x+4,
        y:s.y+7,
        w:s.w-8,
        h:s.h-7
      })
    ){
      die();
      return;
    }
  }

  /* enemies */

  for(const e of enemies){

    if(!e.alive)continue;

    e.x+=e.vx;

    if(e.x<e.min || e.x>e.max){
      e.vx*=-1;
    }

    if(rects(player,e)){
      die();
      return;
    }
  }

  /* coins */

  for(const c of coinsList){

    if(c.taken)continue;

    c.spin+=dt*5;

    if(
      rects(player,{
        x:c.x-c.r,
        y:c.y-c.r,
        w:c.r*2,
        h:c.r*2
      })
    ){

      c.taken=true;
      coins++;

      beep(760,.07,"sine",.04);

      for(let i=0;i<8;i++){
        particles.push({
          x:c.x,
          y:c.y,
          vx:(Math.random()-.5)*3,
          vy:(Math.random()-.5)*3,
          life:20
        });
      }
    }
  }

  /* exit */

  if(
    exit.open &&
    rects(player,{
      x:exit.x,
      y:exit.y,
      w:exit.w,
      h:exit.h
    })
  ){

    if(exit.fake){

      die();

    }else{
      nextLevel();
    }
  }

  /* camera */

  const target=player.x-W*.38;

  cameraX += (target-cameraX)*.10;

  cameraX=Math.max(
    0,
    Math.min(levelWidth-W,cameraX)
  );

  /* particles */

  for(const p of particles){
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=.15;
    p.life--;
  }

  particles=particles.filter(p=>p.life>0);

  if(shake>0)shake*=.86;
}

/* =========================================================
   DRAWING
========================================================= */

function draw(){

  ctx.save();

  let sx=0;
  let sy=0;

  if(shake>.5){
    sx=(Math.random()-.5)*shake;
    sy=(Math.random()-.5)*shake;
  }

  ctx.translate(sx,sy);

  drawBackground();

  if(state==="menu"){
    drawMenu();
  }
  else if(state==="play"){
    drawGame();
  }
  else if(state==="win"){
    drawWin();
  }

  ctx.restore();
}

/* ---------------- BACKGROUND ---------------- */

function drawBackground(){

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#05070c");
  g.addColorStop(1,"#11151d");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* subtle grid */

  ctx.globalAlpha=.12;
  ctx.strokeStyle="#6f7b91";
  ctx.lineWidth=1;

  const offset=(cameraX*.2)%60;

  for(let x=-60-offset;x<W+60;x+=60){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=0;y<H;y+=60){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  ctx.globalAlpha=1;

  /* moon */

  ctx.fillStyle="#e8edf5";
  ctx.globalAlpha=.08;
  ctx.beginPath();
  ctx.arc(W*.82,H*.18,70,0,Math.PI*2);
  ctx.fill();

  ctx.globalAlpha=1;
}

/* ---------------- GAME DRAW ---------------- */

function drawGame(){

  ctx.save();

  ctx.translate(-cameraX,0);

  /* platforms */

  for(const p of platforms){

    if(!p.active)continue;

    ctx.fillStyle=
      p.type==="crumble"
      ? "#8e96a8"
      : "#d8dde7";

    ctx.fillRect(p.x,p.y,p.w,p.h);

    ctx.fillStyle="#555e70";
    ctx.fillRect(p.x,p.y,p.w,5);

    if(p.type==="crumble"){
      ctx.strokeStyle="#242a36";
      ctx.beginPath();

      for(let x=p.x+15;x<p.x+p.w;x+=28){
        ctx.moveTo(x,p.y+7);
        ctx.lineTo(x+10,p.y+22);
      }

      ctx.stroke();
    }
  }

  /* moving platforms */

  for(const p of moving){

    ctx.fillStyle="#aeb8c9";
    ctx.fillRect(p.x,p.y,p.w,p.h);

    ctx.fillStyle="#586273";
    ctx.fillRect(p.x,p.y,p.w,4);
  }

  /* spikes */

  for(const s of spikes){

    if(!s.active)continue;

    ctx.fillStyle="#e8edf5";

    const count=Math.max(1,Math.floor(s.w/14));
    const sw=s.w/count;

    for(let i=0;i<count;i++){

      ctx.beginPath();
      ctx.moveTo(s.x+i*sw,s.y+s.h);
      ctx.lineTo(s.x+i*sw+sw/2,s.y);
      ctx.lineTo(s.x+(i+1)*sw,s.y+s.h);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* coins */

  for(const c of coinsList){

    if(c.taken)continue;

    const squish=.65+Math.abs(Math.sin(c.spin))*.35;

    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.scale(squish,1);

    ctx.fillStyle="#f3d46b";
    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#6b5620";
    ctx.font="bold 10px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("G",0,1);

    ctx.restore();
  }

  /* enemies */

  for(const e of enemies){

    if(!e.alive)continue;

    ctx.fillStyle="#d5d9e2";
    ctx.fillRect(e.x,e.y,e.w,e.h);

    ctx.fillStyle="#11151c";
    ctx.fillRect(e.x+5,e.y+8,5,5);
    ctx.fillRect(e.x+18,e.y+8,5,5);

    ctx.fillStyle="#717b8d";
    ctx.fillRect(e.x+7,e.y+25,14,4);
  }

  /* exit */

  drawExit();

  /* player */

  drawPlayer();

  /* particles */

  for(const p of particles){

    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.fillStyle="#e8edf5";
    ctx.fillRect(p.x,p.y,4,4);
    ctx.globalAlpha=1;
  }

  ctx.restore();

  drawHUD();

  if(gimmick.darkness){
    ctx.fillStyle="rgba(0,0,0,.46)";

    const grd=ctx.createRadialGradient(
      W*.38,H*.48,80,
      W*.38,H*.48,330
    );

    grd.addColorStop(0,"rgba(0,0,0,0)");
    grd.addColorStop(1,"rgba(0,0,0,.9)");

    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);
  }

  drawControls();
}

/* ---------------- PLAYER ---------------- */

function drawPlayer(){

  const p=player;

  ctx.save();

  /* body */

  ctx.fillStyle="#f2f4f8";
  ctx.fillRect(p.x,p.y,p.w,p.h);

  /* head */

  ctx.fillStyle="#ffffff";
  ctx.beginPath();
  ctx.arc(
    p.x+p.w/2,
    p.y-4,
    12,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* eye */

  ctx.fillStyle="#0b0d12";

  ctx.fillRect(
    p.x+(p.face>0?17:5),
    p.y-7,
    4,
    4
  );

  /* legs */

  ctx.fillStyle="#b6bfce";
  ctx.fillRect(p.x+3,p.y+p.h-3,7,9);
  ctx.fillRect(p.x+p.w-10,p.y+p.h-3,7,9);

  ctx.restore();
}

/* ---------------- EXIT ---------------- */

function drawExit(){

  const x=exit.x;
  const y=exit.y;

  ctx.fillStyle="#252b37";
  ctx.fillRect(x,y,exit.w,exit.h);

  ctx.strokeStyle="#f0f3f8";
  ctx.lineWidth=3;
  ctx.strokeRect(x+2,y+2,exit.w-4,exit.h-2);

  ctx.fillStyle="#e8edf5";
  ctx.fillRect(x+11,y+12,28,4);

  ctx.fillStyle="#697386";
  ctx.fillRect(x+12,y+28,26,4);

  ctx.fillStyle="#ffffff";
  ctx.beginPath();
  ctx.arc(x+39,y+54,3,0,Math.PI*2);
  ctx.fill();
}

/* ---------------- HUD ---------------- */

function drawHUD(){

  ctx.fillStyle="rgba(5,7,11,.75)";
  ctx.fillRect(0,0,W,58);

  ctx.fillStyle="#ffffff";
  ctx.font="bold 14px Arial";
  ctx.textAlign="left";

  ctx.fillText(
    "GAZELLA",
    18,
    24
  );

  ctx.font="12px Arial";
  ctx.fillStyle="#9da7b8";

  ctx.fillText(
    "LEVEL "+(level+1)+" / 20",
    18,
    43
  );

  ctx.textAlign="center";

  ctx.fillStyle="#dce1ea";

  ctx.fillText(
    "☠ "+deaths,
    W*.50,
    24
  );

  ctx.fillText(
    "● "+coins,
    W*.50,
    43
  );

  ctx.textAlign="right";

  ctx.fillStyle="#9da7b8";
  ctx.fillText(
    "DON'T TRUST THE FLOOR",
    W-18,
    32
  );
}

/* ---------------- TOUCH CONTROLS ---------------- */

function drawControls(){

  const size=Math.min(86,W*.19);
  const gap=14;
  const y=H-size-22;

  function control(x,label){

    ctx.fillStyle="rgba(255,255,255,.09)";
    ctx.strokeStyle="rgba(255,255,255,.2)";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.roundRect(x,y,size,size,20);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle="#e9edf5";
    ctx.font="bold 28px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(label,x+size/2,y+size/2);
  }

  control(18,"‹");
  control(18+size+gap,"›");

  ctx.fillStyle="rgba(255,255,255,.13)";
  ctx.strokeStyle="rgba(255,255,255,.25)";

  ctx.beginPath();
  ctx.roundRect(W-size-20,y-20,size,size,22);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle="#ffffff";
  ctx.font="bold 15px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "JUMP",
    W-size/2-20,
    y+size/2-20
  );
}

/* ---------------- MENU ---------------- */

function drawMenu(){

  ctx.fillStyle="#ffffff";
  ctx.textAlign="center";

  ctx.font="900 46px Arial";
  ctx.fillText(
    "GAZELLA",
    W/2,
    H*.30
  );

  ctx.font="bold 18px Arial";
  ctx.fillStyle="#aab3c2";

  ctx.fillText(
    "DON'T TRUST THE FLOOR",
    W/2,
    H*.30+38
  );

  ctx.font="14px Arial";
  ctx.fillStyle="#727c8d";

  ctx.fillText(
    "20 levels • traps • surprises • escape",
    W/2,
    H*.30+78
  );

  const bw=Math.min(270,W-50);
  const bh=62;
  const bx=(W-bw)/2;
  const by=H*.57;

  ctx.fillStyle="#f1f3f7";

  ctx.beginPath();
  ctx.roundRect(bx,by,bw,bh,18);
  ctx.fill();

  ctx.fillStyle="#090b10";
  ctx.font="bold 17px Arial";

  ctx.fillText(
    "START GAME",
    W/2,
    by+37
  );

  ctx.font="12px Arial";
  ctx.fillStyle="#6f7887";

  ctx.fillText(
    "Tap the button or press ENTER",
    W/2,
    by+95
  );

  ctx.fillText(
    "A/D or arrows • Space to jump",
    W/2,
    by+118
  );

  /* start touch area */

  canvas.onclick=e=>{

    if(
      e.clientX>=bx &&
      e.clientX<=bx+bw &&
      e.clientY>=by &&
      e.clientY<=by+bh
    ){
      startGame();
    }
  };
}

/* ---------------- WIN ---------------- */

function drawWin(){

  ctx.fillStyle="#ffffff";
  ctx.textAlign="center";

  ctx.font="900 44px Arial";
  ctx.fillText(
    "YOU ESCAPED.",
    W/2,
    H*.27
  );

  ctx.font="bold 20px Arial";
  ctx.fillStyle="#aeb7c5";

  ctx.fillText(
    "GAZELLA CHALLENGE COMPLETE",
    W/2,
    H*.27+40
  );

  const boxW=Math.min(370,W-40);
  const boxH=260;
  const bx=(W-boxW)/2;
  const by=H*.40;

  ctx.fillStyle="rgba(255,255,255,.06)";
  ctx.strokeStyle="rgba(255,255,255,.15)";

  ctx.beginPath();
  ctx.roundRect(bx,by,boxW,boxH,24);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle="#ffffff";
  ctx.font="bold 17px Arial";

  ctx.fillText(
    "COMPLETION REWARD",
    W/2,
    by+48
  );

  ctx.font="900 54px Arial";
  ctx.fillText(
    "₹200",
    W/2,
    by+108
  );

  ctx.font="13px Arial";
  ctx.fillStyle="#9ca6b5";

  ctx.fillText(
    "Save this winning screen.",
    W/2,
    by+145
  );

  ctx.fillText(
    "Contact @gazelle.giveaway",
    W/2,
    by+170
  );

  ctx.fillText(
    "for prize verification.",
    W/2,
    by+191
  );

  ctx.font="11px Arial";
  ctx.fillStyle="#697384";

  ctx.fillText(
    "Prize eligibility and verification rules apply.",
    W/2,
    by+225
  );
}

/* ---------------- MAIN LOOP ---------------- */

function loop(now){

  const dt=Math.min(
    .033,
    (now-last)/1000
  );

  last=now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   MENU TOUCH START
========================================================= */

canvas.addEventListener("pointerdown",e=>{

  if(state!=="menu")return;

  const bw=Math.min(270,W-50);
  const bh=62;
  const bx=(W-bw)/2;
  const by=H*.57;

  if(
    e.clientX>=bx &&
    e.clientX<=bx+bw &&
    e.clientY>=by &&
    e.clientY<=by+bh
  ){
    startGame();
  }
});

/* =========================================================
   SAFETY: stop scrolling on iOS
========================================================= */

window.addEventListener("touchmove",e=>{
  e.preventDefault();
},{passive:false});

window.addEventListener("touchstart",e=>{
  e.preventDefault();
},{passive:false});

window.addEventListener("touchend",e=>{
  e.preventDefault();
},{passive:false});

</script>
