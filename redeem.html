<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Redeem ₹25,000</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 20% 20%,#123c37,transparent 35%),
    radial-gradient(circle at 80% 80%,#242044,transparent 35%),
    #050508;
}

.card{
  width:100%;
  max-width:520px;
  text-align:center;
  padding:45px 25px;
  border-radius:30px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(20px);
  box-shadow:0 25px 80px rgba(0,0,0,.55);
  animation:appear .8s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(30px) scale(.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:50px;
  background:rgba(0,255,213,.1);
  border:1px solid rgba(0,255,213,.3);
  color:#00ffd5;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
}

h1{
  margin-top:25px;
  font-size:24px;
}

.amount{
  margin:20px 0;
  font-size:65px;
  font-weight:900;
  color:#00ffd5;
  text-shadow:0 0 35px rgba(0,255,213,.25);
}

p{
  color:#aaa;
  line-height:1.6;
}

.instagram{
  display:block;
  margin-top:28px;
  padding:16px;
  border-radius:15px;
  background:#00ffd5;
  color:#00110e;
  text-decoration:none;
  font-weight:900;
}

.note{
  margin-top:20px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">

  <div class="badge">QUIZ COMPLETED • 15/15</div>

  <h1>Congratulations 🎉</h1>

  <div class="amount">₹25,000</div>

  <p>
    Your prize has been unlocked.<br>
    Contact Gazella Giveaway on Instagram
    to continue with the redemption process.
  </p>

  <a
    class="instagram"
    href="https://www.instagram.com/gazelle.giveaway/"
    target="_blank"
  >
    REDEEM VIA INSTAGRAM
  </a>

  <div class="note">
    Send <strong>REDEEM</strong> in your Instagram message.
  </div>

</div>

</body>
</html>
